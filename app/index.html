<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>離線小遊戲</title>
<style>
  :root { --bg: #f4f1ea; --panel: #fffdf8; --ink: #22252b; --muted: #8a8d94; --border: #d9d4c7; --accent: #2f6fde; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17191e; --panel: #20232a; --ink: #e8e9ec; --muted: #8e929b; --border: #363a44; --accent: #6ea0ff; }
  }
  body {
    margin: 0; padding: 24px 16px; background: var(--bg); color: var(--ink);
    font-family: "Segoe UI", "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 26px; margin: 0 0 16px; }
  .games { display: grid; gap: 12px; }
  .games a {
    display: block; padding: 16px 18px; border: 1px solid var(--border); border-radius: 12px;
    background: var(--panel); color: var(--ink); text-decoration: none;
  }
  .games a:hover { border-color: var(--accent); }
  .games strong { font-size: 18px; }
  .games span { display: block; margin-top: 4px; font-size: 14px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>離線小遊戲</h1>
  <div class="games">
    <a href="slitherlink/index.html">
      <strong>數迴 Slitherlink</strong>
      <span>依數字畫線,連成一個迴圈。3×3 ~ 9×9,三種難度。</span>
    </a>
    <a href="hashi/index.html">
      <strong>造橋 Hashiwokakero</strong>
      <span>依島上的數字蓋橋,把所有島連成一片。5×5 ~ 9×9,三種難度。</span>
    </a>
    <a href="1a2b/index.html">
      <strong>猜數字 1A2B</strong>
      <span>猜出不重複的數字,靠幾 A 幾 B 的線索推理。3 ~ 5 位數。</span>
    </a>
    <a href="holdem/index.html">
      <strong>德州撲克 Texas Hold'em</strong>
      <span>和 3 個電腦對手比牌,贏光所有籌碼。純遊戲籌碼。</span>
    </a>
    <a href="junqi/index.html">
      <strong>兩人軍棋</strong>
      <span>布陣暗棋:排好自己的 25 顆棋,和電腦對戰,奪下對方軍旗。</span>
    </a>
    <a href="walls/index.html">
      <strong>圍牆棋</strong>
      <span>走棋、蓋牆、圍地盤。2 ~ 4 人,可對電腦或真人輪流,可選破牆。</span>
    </a>
  </div>
</main>
<script>
// 用網址開啟時,把遊戲存到裝置上,之後沒網路也能玩(直接開檔案時不需要)
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('../sw.js').catch(function () { /* 不支援就照常使用 */ });
}
</script>
</body>
</html>
